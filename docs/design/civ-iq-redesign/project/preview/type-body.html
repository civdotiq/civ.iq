<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 24px; }
  .spec { display: grid; grid-template-columns: 110px 1fr auto; align-items: baseline; gap: 18px; border-bottom: 1px solid var(--line); padding: 10px 0; }
  .spec:last-child { border-bottom: 0; }
  .spec .tag { font-family: var(--font-mono); color: var(--fg3); font-size: 11px; }
  .spec .meta { font-family: var(--font-mono); color: var(--fg3); font-size: 10px; white-space: nowrap; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--fg3); text-transform: uppercase; }
</style>
</head>
<body>
<div class="spec">
  <span class="tag">Subhead</span>
  <span style="font-size:18px; font-weight:600; letter-spacing:0.08em;">About this record</span>
  <span class="meta">18 / 600 / +8%</span>
</div>
<div class="spec">
  <span class="tag">Body</span>
  <span style="font-size:16px; line-height:1.5; color:var(--fg2);">Jeffries voted yes on 87% of party-line bills in 2024.</span>
  <span class="meta">16 / 400 / +2.5%</span>
</div>
<div class="spec">
  <span class="tag">Small</span>
  <span style="font-size:14px; color:var(--fg2);">Source: Congress.gov roll call votes.</span>
  <span class="meta">14 / 400 / +2.5%</span>
</div>
<div class="spec">
  <span class="tag">Eyebrow</span>
  <span class="eyebrow">SOURCE · FEC.GOV · 2024 CYCLE</span>
  <span class="meta">12 / 700 / +8% / UPPER</span>
</div>
</body>
</html>
