<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 20px; background: #fff; }
  .sheet {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 0;
    border: 1px solid #000;
  }
  .tile {
    aspect-ratio: 1 / 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    background: #fff;
    position: relative;
  }
  /* Hairline mullions between tiles — not outer, just dividers */
  .tile:not(:nth-child(8n)):after {
    content: ''; position: absolute; top: 12%; right: 0; bottom: 12%; width: 1px; background: #e5e7eb;
  }
  .tile:not(:nth-last-child(-n+8)):before {
    content: ''; position: absolute; left: 12%; right: 12%; bottom: 0; height: 1px; background: #e5e7eb;
  }
  .tile svg { width: 44%; height: 44%; display: block; }
  .tile .name {
    font-size: 9px; font-weight: 600; letter-spacing: 0.06em;
    color: var(--fg3); text-transform: uppercase;
  }
  .caption { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; }
  .caption .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--fg3); text-transform: uppercase; }
  .caption .spec { font-family: var(--font-mono); font-size: 10px; color: var(--fg3); }

  /* Icon drawing rules */
  svg.ico { stroke: #111827; stroke-width: 2; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
  svg.ico .fill { fill: #111827; stroke: none; }
</style>
</head>
<body>

<div class="sheet">

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <rect x="4" y="10" width="16" height="10"/>
      <polyline points="2,11 12,3 22,11"/>
    </svg>
    <span class="name">Address</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <circle cx="10" cy="10" r="6"/>
      <line x1="14.5" y1="14.5" x2="20" y2="20"/>
    </svg>
    <span class="name">Search</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <circle cx="12" cy="9" r="6"/>
      <line x1="12" y1="15" x2="12" y2="22"/>
      <circle class="fill" cx="12" cy="9" r="2"/>
    </svg>
    <span class="name">Location</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16"/>
      <line x1="3" y1="9" x2="21" y2="9"/>
      <line x1="9" y1="9"  x2="9"  y2="20"/>
      <line x1="15" y1="9" x2="15" y2="20"/>
    </svg>
    <span class="name">District</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <rect x="3" y="4" width="16" height="18"/>
      <line x1="6"  y1="9"  x2="16" y2="9"/>
      <line x1="6"  y1="13" x2="16" y2="13"/>
      <line x1="6"  y1="17" x2="12" y2="17"/>
    </svg>
    <span class="name">Bill</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18"/>
      <polyline points="6,13 10,17 18,8" style="stroke-width:2.25"/>
    </svg>
    <span class="name">Vote</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="6"  x2="12" y2="18"/>
      <path d="M15,9 H10.5 a2.5,2.5 0 0 0 0,5 h3 a2.5,2.5 0 0 1 0,5 H9" stroke-linecap="round"/>
    </svg>
    <span class="name">Funding</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <line x1="3"  y1="21" x2="21" y2="21"/>
      <rect x="5"  y="13" width="3" height="8"/>
      <rect x="10.5" y="8"  width="3" height="13"/>
      <rect x="16" y="4"  width="3" height="17"/>
    </svg>
    <span class="name">Stats</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <circle cx="12" cy="6.5" r="2.5"/>
      <path d="M7,21 v-6 h10 v6"/>
      <line x1="9" y1="21" x2="9" y2="15"/>
      <line x1="15" y1="21" x2="15" y2="15"/>
    </svg>
    <span class="name">Official</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <circle cx="7" cy="7.5" r="2.25"/>
      <circle cx="17" cy="7.5" r="2.25"/>
      <path d="M3,20 v-4 h8 v4"/>
      <path d="M13,20 v-4 h8 v4"/>
    </svg>
    <span class="name">Committee</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <rect x="3"  y="3"  width="8" height="8"/>
      <rect x="13" y="3"  width="8" height="8"/>
      <rect x="3"  y="13" width="8" height="8"/>
      <rect x="13" y="13" width="8" height="8"/>
    </svg>
    <span class="name">Sources</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="7"  x2="12" y2="13"/>
      <circle class="fill" cx="12" cy="17" r="1.2"/>
    </svg>
    <span class="name">Alert</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <circle class="fill" cx="12" cy="8" r="1.2"/>
      <line x1="12" y1="11" x2="12" y2="17"/>
    </svg>
    <span class="name">Info</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12,7 12,12 16,14"/>
    </svg>
    <span class="name">Recent</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16"/>
      <line x1="3" y1="9" x2="21" y2="9"/>
      <line x1="8" y1="3" x2="8" y2="7"/>
      <line x1="16" y1="3" x2="16" y2="7"/>
    </svg>
    <span class="name">Calendar</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14"/>
      <polyline points="3,6 12,14 21,6"/>
    </svg>
    <span class="name">Contact</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <line x1="4"  y1="6"  x2="20" y2="6"/>
      <line x1="4"  y1="12" x2="20" y2="12"/>
      <line x1="4"  y1="18" x2="20" y2="18"/>
    </svg>
    <span class="name">Menu</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <line x1="5"  y1="5"  x2="19" y2="19"/>
      <line x1="19" y1="5"  x2="5"  y2="19"/>
    </svg>
    <span class="name">Close</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <line x1="5" y1="12" x2="17" y2="12"/>
      <polygon class="fill" points="21,12 14,7 14,17"/>
    </svg>
    <span class="name">Next</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <line x1="7" y1="12" x2="19" y2="12"/>
      <polygon class="fill" points="3,12 10,7 10,17"/>
    </svg>
    <span class="name">Back</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <polyline points="5,13 10,18 20,6" style="stroke-width:2.5"/>
    </svg>
    <span class="name">Yes</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <line x1="6"  y1="6"  x2="18" y2="18" style="stroke-width:2.5"/>
      <line x1="18" y1="6"  x2="6"  y2="18" style="stroke-width:2.5"/>
    </svg>
    <span class="name">No</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <rect x="9" y="4" width="6" height="5"/>
      <line x1="12" y1="9" x2="12" y2="16"/>
      <rect x="9" y="16" width="6" height="4"/>
    </svg>
    <span class="name">Call</span>
  </div>

  <div class="tile">
    <svg class="ico" viewBox="0 0 24 24">
      <rect x="4" y="3" width="15" height="18"/>
      <line x1="4" y1="7" x2="19" y2="7"/>
      <line x1="8" y1="11" x2="15" y2="11"/>
      <line x1="8" y1="14" x2="15" y2="14"/>
      <line x1="8" y1="17" x2="12" y2="17"/>
    </svg>
    <span class="name">Record</span>
  </div>

</div>

<div class="caption">
  <span class="lbl">CIV.IQ Icon family · 2px stroke · 24px grid · Square cap, miter join</span>
  <span class="spec">24 glyphs · 1.75px minimum</span>
</div>

</body>
</html>
