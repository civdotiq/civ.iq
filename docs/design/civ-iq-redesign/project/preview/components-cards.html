<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card {
    border: 2px solid #000; padding: 16px; background: #fff;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--fg3); text-transform: uppercase; }
  .card .title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .card .body { font-size: 13px; color: var(--fg2); line-height: 1.5; }
  .card.soft { border: 1px solid var(--line); border-left: 3px solid var(--civiq-blue); background: #f9fafb; }
  .party-chip { display: inline-block; padding: 3px 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; }
  .party-chip.d { background: #0a9338; }
  .party-chip.r { background: #e11d07; }
  .meta-row { display: flex; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: 11px; color: var(--fg3); }
</style>
</head>
<body>
<div class="grid">
  <div class="card">
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="party-chip d">D · NY-08</span>
      <span class="eyebrow">Representative</span>
    </div>
    <div class="title">Hakeem S. Jeffries</div>
    <div class="body">House Minority Leader. In office since 2013. Represents Brooklyn & Queens.</div>
    <div class="meta-row">votes · 1,248 · funding · $2.4M</div>
  </div>
  <div class="card soft">
    <span class="eyebrow">Source note</span>
    <div class="body" style="color:var(--fg1)">Records pulled from FEC, Congress.gov, USASpending.gov, and Senate LDA filings. Updated weekly.</div>
  </div>
</div>
</body>
</html>
