<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 24px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--fg3); text-transform: uppercase; }
  .input {
    font-family: var(--font-primary); font-size: 15px; padding: 12px 14px;
    border: 2px solid #000; background: #fff; border-radius: 3px; outline: none;
  }
  .input:focus { border-color: var(--civiq-blue); box-shadow: 0 0 0 3px rgba(62,162,212,0.2); }
  .input.hint { color: var(--fg4); }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .row .input { flex: 1; }
  .err-msg { font-size: 11px; color: #b45309; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="stack">
  <div class="field">
    <span class="lbl">Home Address · Primary lookup</span>
    <div class="row">
      <input class="input" value="1600 Pennsylvania Ave NW, Washington, DC 20500">
      <button class="btn primary" style="font-family:var(--font-primary);font-weight:700;font-size:13px;letter-spacing:0.05em;text-transform:uppercase;padding:12px 22px;border-radius:3px;background:#3ea2d4;color:#fff;border:2px solid #3ea2d4;cursor:pointer;">Find my officials</button>
    </div>
  </div>
  <div class="field">
    <span class="lbl">ZIP (disabled)</span>
    <input class="input hint" value="Enter a ZIP" disabled style="background:#f3f4f6">
  </div>
  <div class="field">
    <span class="lbl" style="color:#b45309">Address · Error</span>
    <input class="input" value="1600 Pennzzylvania" style="border-color:#b45309">
    <span class="err-msg">Address not found. Check spelling or try a ZIP code.</span>
  </div>
</div>
</body>
</html>
