<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 24px; }
  .row { display: flex; gap: 40px; align-items: flex-start; }
  .stat { display: flex; flex-direction: column; gap: 6px; }
  .stat .num { font-size: 72px; font-weight: 700; line-height: 0.9; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .stat .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--fg3); text-transform: uppercase; }
  .stat .sub { font-size: 13px; color: var(--fg2); }
  code.mono { background: var(--bg3); padding: 6px 10px; font-size: 12px; display: inline-block; }
</style>
</head>
<body>
<div class="row">
  <div class="stat">
    <span class="lbl">Total raised</span>
    <span class="num" style="color:var(--civiq-blue)">$2.4M</span>
    <span class="sub">2024 cycle, FEC filings</span>
  </div>
  <div class="stat">
    <span class="lbl">Party vote rate</span>
    <span class="num">87<span style="font-size:36px">%</span></span>
    <span class="sub">Democrat line — 118th Congress</span>
  </div>
  <div style="margin-left:auto; display:flex; flex-direction:column; gap:8px;">
    <span style="font-size:10px; font-weight:700; letter-spacing:0.08em; color:var(--fg3);">MONO · IDs & tokens</span>
    <code class="mono">H.R. 8404</code>
    <code class="mono">FEC-ID: C00399001</code>
  </div>
</div>
</body>
</html>
