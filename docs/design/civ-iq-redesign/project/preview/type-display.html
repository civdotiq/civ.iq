<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 24px; }
  .spec { display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 18px; border-bottom: 1px solid var(--line); padding: 12px 0; }
  .spec:last-child { border-bottom: 0; }
  .spec .tag { min-width: 72px; font-family: var(--font-mono); color: var(--fg3); }
  .spec .meta { font-family: var(--font-mono); color: var(--fg3); font-size: 11px; white-space: nowrap; }
  .aicher-display { font-size: 56px; line-height: 1.0; }
  .aicher-title { font-size: 28px; }
  .aicher-heading { font-size: 22px; }
</style>
</head>
<body>
<div class="spec">
  <span class="tag">H1 · Display</span>
  <span class="aicher-display">HAKEEM&nbsp;JEFFRIES</span>
  <span class="meta">64 / 700 / −2% / UPPER</span>
</div>
<div class="spec">
  <span class="tag">H2 · Title</span>
  <span class="aicher-title">VOTING RECORD</span>
  <span class="meta">32 / 700 / +2% / UPPER</span>
</div>
<div class="spec">
  <span class="tag">H3 · Head</span>
  <span class="aicher-heading">Recent votes (118th Congress)</span>
  <span class="meta">24 / 700 / +2%</span>
</div>
</body>
</html>
