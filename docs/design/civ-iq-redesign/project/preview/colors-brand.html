<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 24px; }
  .swatch { height: 96px; flex-direction: column; align-items: flex-start; justify-content: flex-end; }
  .swatch .name { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .swatch .hex { font-family: var(--font-mono); font-size: 10px; font-weight: 400; letter-spacing: 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
</style>
</head>
<body>
<div class="grid">
  <div class="swatch" style="background:#e11d07"><div class="name">Civiq Red</div><div class="hex">#E11D07</div></div>
  <div class="swatch" style="background:#0a9338"><div class="name">Civiq Green</div><div class="hex">#0A9338</div></div>
  <div class="swatch" style="background:#3ea2d4"><div class="name">Civiq Blue</div><div class="hex">#3EA2D4</div></div>
</div>
<div style="margin-top:10px; font-size:11px; color:var(--fg3); letter-spacing:0.04em;">
  The 1972 Munich primaries. Red = Republican / urgency. Green = Democrat. Blue = Action / info.
</div>
</body>
</html>
