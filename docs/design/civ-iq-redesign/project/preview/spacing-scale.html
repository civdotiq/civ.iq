<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .bar { background: var(--civiq-blue); height: 16px; }
  .cell .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--fg3); text-transform: uppercase; }
  .cell .val { font-family: var(--font-mono); font-size: 11px; color: var(--fg2); }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><div class="bar" style="width:8px"></div><div class="lbl">1×</div><div class="val">8px</div></div>
  <div class="cell"><div class="bar" style="width:16px"></div><div class="lbl">2×</div><div class="val">16px</div></div>
  <div class="cell"><div class="bar" style="width:24px"></div><div class="lbl">3×</div><div class="val">24px</div></div>
  <div class="cell"><div class="bar" style="width:32px"></div><div class="lbl">4×</div><div class="val">32px</div></div>
  <div class="cell"><div class="bar" style="width:48px"></div><div class="lbl">6×</div><div class="val">48px</div></div>
  <div class="cell"><div class="bar" style="width:64px"></div><div class="lbl">8×</div><div class="val">64px</div></div>
</div>
<div style="margin-top:16px; font-size:11px; color:var(--fg3); letter-spacing:0.04em;">
  Ulm systematic 8px grid. All padding, margin, gap values are multiples.
</div>
</body>
</html>
