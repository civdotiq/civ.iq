<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CIV.IQ — Web UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #111827; }
  body { font-family: var(--font-primary); }
  a { color: inherit; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="TopNav.jsx"></script>
<script type="text/babel" src="LandingScreen.jsx"></script>
<script type="text/babel" src="AddressResultScreen.jsx"></script>
<script type="text/babel" src="OfficialDetailScreen.jsx"></script>

<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState(() => {
    try { return localStorage.getItem('civiq.screen') || 'landing'; } catch { return 'landing'; }
  });
  const [address, setAddress] = React.useState('1600 Pennsylvania Ave NW, Washington DC');
  const [officialId, setOfficialId] = React.useState('jeffries');

  React.useEffect(() => { try { localStorage.setItem('civiq.screen', screen); } catch {} }, [screen]);

  return (
    <>
      <TopNav onLogo={() => setScreen('landing')} currentScreen={screen}/>
      {screen === 'landing' && (
        <LandingScreen onSubmit={(a) => { setAddress(a); setScreen('result'); }}/>
      )}
      {screen === 'result' && (
        <AddressResultScreen
          address={address}
          onBack={() => setScreen('landing')}
          onSelect={(id) => { setOfficialId(id); setScreen('detail'); }}
        />
      )}
      {screen === 'detail' && (
        <OfficialDetailScreen officialId={officialId} onBack={() => setScreen('result')}/>
      )}
      <footer style={{ borderTop: '2px solid #000', padding: '32px', display:'flex', justifyContent:'space-between', alignItems:'center', fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#6b7280' }}>
        <span>CIV.IQ · 2026 · Public Record, Made Legible</span>
        <span>No ads · No signups · No editorializing</span>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
