<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CIV.IQ — Embed Mode (Templates 30–33)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #f3f4f6; }
  body { font-family: var(--font-primary); color: #111827; }
  * { box-sizing: border-box; }
  input::placeholder { color: #9ca3af; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="SearchVariants.jsx"></script>
<script type="text/babel" src="EmbedMode.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas
      title="CIV.IQ — Canvas 6 · Embed Mode (Templates 30–33)"
      subtitle="Mast-less chassis variant for third-party publishers, plus 3 example panels at responsive widths (320/480/640) and 1 letter-size print template. The host site is the masthead; CIV.IQ contributes data + source rails + plain reading + a single bottom attribution."
    >
      <DCSection id="embed-panels" title="Embed panels — three panels × three widths">
        <DCArtboard
          id="embed-canvas"
          label="30–32 · Embed panels at 320 / 480 / 640 px wide"
          width={1280}
          height={2700}
        >
          <EmbedCanvasPage/>
        </DCArtboard>
      </DCSection>

      <DCSection id="print" title="Print — letter-size paper version">
        <DCArtboard
          id="print-district"
          label="33 · PrintDistrict — /districts/[districtId]/print · NY-08"
          width={1080}
          height={1280}
        >
          <PrintCanvasPage/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
