name: Accessibility Issue
description: Report a barrier that prevents you from using CIV.IQ
title: "[A11y]: "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        CIV.IQ is civic infrastructure that should be usable by everyone. If you've encountered a barrier, please report it here.
  - type: textarea
    id: description
    attributes:
      label: What barrier did you encounter?
      description: Describe what you were trying to do and what prevented you.
      placeholder: "The WaffleChart on the district demographics page doesn't convey any information through my screen reader..."
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: "https://civdotiq.org/districts/CA-12"
    validations:
      required: true
  - type: dropdown
    id: assistive_tech
    attributes:
      label: Assistive technology used
      options:
        - Screen reader (VoiceOver)
        - Screen reader (NVDA)
        - Screen reader (JAWS)
        - Screen reader (other)
        - Keyboard navigation only
        - Screen magnifier
        - Voice control
        - Switch device
        - High contrast mode
        - Reduced motion
        - None / visual inspection
        - Other
    validations:
      required: true
  - type: dropdown
    id: wcag
    attributes:
      label: WCAG criterion (if known)
      description: Optional. If you know which guideline applies, select it.
      options:
        - "Not sure"
        - "1.1.1 Non-text Content"
        - "1.3.1 Info and Relationships"
        - "1.4.1 Use of Color"
        - "1.4.3 Contrast (Minimum)"
        - "2.1.1 Keyboard"
        - "2.4.1 Bypass Blocks"
        - "2.4.4 Link Purpose"
        - "2.4.7 Focus Visible"
        - "3.1.1 Language of Page"
        - "4.1.2 Name, Role, Value"
        - "Other"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser, OS, screenshots, or anything else that helps us understand the barrier.
