name: Mirror Bill Policy Areas

# /ask/topic-bills/* and the topic pages list bills by policy area. Congress.gov's
# /v3/bill list never returns policyArea and has no policy-area filter, so that
# question cannot be answered live. GovInfo BILLSTATUS bulk data carries the
# CRS-assigned <policyArea> for every bill; this mirrors it into
# data/bill-policy-areas.json.br (~300 KB). The same pass also derives
# data/member-sponsored-counts.json (bills and resolutions each member introduced,
# for the /api/search filter). No secret is needed — public bulk zips, not an
# API. See PLAN-bill-policy-area-corpus.md.

on:
  schedule:
    # Weekly, Wednesday 06:45 UTC — offset from the other corpus mirrors so they
    # are not rebasing onto each other. CRS assigns policy areas with a lag of
    # weeks, so daily would buy little.
    - cron: '45 6 * * 3'
  workflow_dispatch:
    inputs:
      congress:
        description: 'Congress to mirror'
        required: false
        default: '119'

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Eight zips (hr is ~32 MB) and ~19k small XML parses; the build is well under
    # a minute locally. The timeout catches a hang.
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Mirror BILLSTATUS into data/
        run: npx tsx scripts/sync-bill-policy-areas.ts --congress "${{ inputs.congress || '119' }}"

      # The corpus is the only source of bills-by-policy-area, so a build that
      # silently lost most of it would publish empty topic pages rather than an
      # error. Floors sit far below the real figures (119th, Sept 2026: 16,166
      # bills across 31 areas) and only trip on a structural failure.
      - name: Sanity-check the artifact before committing
        run: |
          node -e '
            const m = require("./data/bill-policy-areas.meta.json");
            if (m.policyAreas < 25) throw new Error(`only ${m.policyAreas} policy areas`);
            if (m.bills < 10000) throw new Error(`only ${m.bills} bills`);
            console.log(`${m.bills} bills across ${m.policyAreas} policy areas, ` +
              `${m.meta.unassigned} unassigned, stale after ${m.staleAfter}`);
            // ~550 sponsors in the 119th (Sept 2026), departed members included.
            const c = require("./data/member-sponsored-counts.meta.json");
            if (c.members < 400) throw new Error(`only ${c.members} sponsoring members`);
            if (c.meta.parsed.hres < 100) throw new Error(`only ${c.meta.parsed.hres} hres`);
            console.log(`${c.members} members with sponsored-bill counts`);
          '

      - name: Commit updated corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage the corpus and its sidecar together so the freshness date never
          # drifts from the data it describes.
          if git diff --quiet -- data/bill-policy-areas.json.br data/member-sponsored-counts.json; then
            echo "No change to the bill policy-area or sponsored-counts corpus"
          else
            git add data/bill-policy-areas.json.br data/bill-policy-areas.meta.json \
              data/member-sponsored-counts.json data/member-sponsored-counts.meta.json
            git commit -m "chore(bills): refresh bill policy-area corpus [skip ci]"
            # Rebase and retry rather than merge: main-protection enforces
            # linear history. Only data/ files are touched here.
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push rejected (attempt $attempt) — rebasing onto origin/main"
              git pull --rebase origin main
            done
            git push
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = '${{ github.workflow }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Scheduled workflow failing: ${workflow}`;
            const body = [
              `The scheduled workflow **${workflow}** failed on run ${context.runId}.`,
              ``,
              `Run: ${runUrl}`,
              `Topic pages keep serving bills from the last committed corpus, so this`,
              `is not an outage — but newly introduced bills stop appearing, and`,
              `data/bill-policy-areas.meta.json passes its staleAfter date.`,
              ``,
              `This issue auto-closes on the next successful run.`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure',
              per_page: 100,
            });
            const match = existing.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Another failure — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sync-failure', 'backbone-freshness'],
              });
            }

      - name: Close stale failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = '${{ github.workflow }}';
            const title = `Scheduled workflow failing: ${workflow}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure',
              per_page: 100,
            });
            const match = existing.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Resolved — workflow succeeded on run ${context.runId}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'closed',
              });
            }
