name: Sync Senate Votes from the Congressional Record

# senate.gov has blocked the sync-senate-votes mirror since 2026-10-23 (issue
# #300). The Congressional Record (GovInfo, GPO) prints every Senate roll call
# the morning after it is held; this reads new ones, checks them (the checks
# matched all 915 roll calls of the 119th Congress to senate.gov, PR #328),
# looks up what each vote was on in Congress.gov, commits them to
# data/senate-votes-119.json.br and posts them to the app. See
# scripts/sync-senate-votes-from-record.ts.

on:
  schedule:
    # Daily at 15:30 UTC: after the 14:17 UTC freshness check, by when the
    # morning's Record is on GovInfo and Congress.gov lists the floor actions.
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target app base URL'
        required: false
        default: 'https://civdotiq.org'
      dry_run:
        description: 'Read and report only: commit nothing, post nothing'
        type: boolean
        required: false
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # About a minute of requests on a vote day; the timeout catches a hang.
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Read new Senate roll calls from the Record
        id: sync
        env:
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIREWALL_BYPASS_TOKEN: ${{ secrets.FIREWALL_BYPASS_TOKEN }}
          BASE_URL: ${{ inputs.base_url || 'https://civdotiq.org' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: ./node_modules/.bin/tsx scripts/sync-senate-votes-from-record.ts $DRY_RUN

      # Roll calls that passed are written even when another one needs a look
      # (the script then exits 1), so commit whenever the file changed.
      - name: Commit stored votes
        if: always() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/senate-votes-119.json.br; then
            echo "No change to the stored Senate votes"
          else
            git add data/senate-votes-119.json.br data/senate-votes-119.meta.json
            git commit -m "chore(senate-votes): add Senate roll calls from the Congressional Record [skip ci]"
            # Rebase and retry rather than merge: main-protection enforces
            # linear history. Only data/ files are touched here.
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push rejected (attempt $attempt) — rebasing onto origin/main"
              git pull --rebase origin main
            done
            git push
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const workflow = '${{ github.workflow }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Scheduled workflow failing: ${workflow}`;
            const body = [
              `The scheduled workflow **${workflow}** failed on run ${context.runId}.`,
              ``,
              `Run: ${runUrl}`,
              `The run's summary lists each roll call that needs a look.`,
              `Scheduled trigger: ${context.eventName}`,
              `SHA: ${context.sha}`,
              ``,
              `This issue auto-closes on the next successful run.`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure',
              per_page: 100,
            });
            const match = existing.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Another failure — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sync-failure', 'backbone-freshness'],
              });
            }

      - name: Close stale failure issue on success
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const workflow = '${{ github.workflow }}';
            const title = `Scheduled workflow failing: ${workflow}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure',
              per_page: 100,
            });
            const match = existing.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Resolved — workflow succeeded on run ${context.runId}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'closed',
              });
            }
