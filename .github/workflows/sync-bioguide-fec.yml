name: Sync Bioguide-FEC Mapping

on:
  schedule:
    # Every Sunday at 14:00 UTC
    - cron: '0 14 * * 0'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run sync
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: npm run sync:bioguide-fec

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet packages/entity-resolution/data/bioguide-fec-mapping.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        with:
          commit-message: 'chore(data): sync bioguide-FEC mapping from congress-legislators'
          branch: auto/sync-bioguide-fec
          delete-branch: true
          title: 'chore(data): sync bioguide-FEC mapping'
          body: |
            Automated weekly sync of the bioguide → FEC candidate ID mapping
            from [unitedstates/congress-legislators](https://github.com/unitedstates/congress-legislators)
            (`legislators-current.yaml`), with Congress.gov + FEC candidate
            search as fallbacks for members not yet in the YAML.

            Canonical file: `packages/entity-resolution/data/bioguide-fec-mapping.json`

            The sync script selects the FEC ID whose chamber prefix (H/S/P)
            matches each member's current term, so veteran members who moved
            between chambers pick up their active ID instead of a stale one.
            When a Congress.gov member is missing from the YAML, the script
            queries FEC `/candidates/search/` and scores each result on
            last-name, first-name, state, office, and party; matches with
            confidence ≥ 0.9 are auto-applied, everything else is listed in
            the workflow log for manual review.

            **Review checklist before merging:**
            - Confirm added/removed bioguide IDs against Congress.gov membership.
            - Spot-check any FEC ID changes (expected for members who switched
              chambers; unexpected otherwise).
            - Verify at-large districts are encoded as `"00"`.
            - Inspect the workflow logs for any `[review]`-tagged low-confidence
              FEC proposals and resolve them manually in this PR if needed.
          add-paths: |
            packages/entity-resolution/data/bioguide-fec-mapping.json

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = '${{ github.workflow }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Scheduled workflow failing: ${workflow}`;
            const body = [
              `The scheduled workflow **${workflow}** failed on run ${context.runId}.`,
              ``,
              `Run: ${runUrl}`,
              `Scheduled trigger: ${context.eventName}`,
              `SHA: ${context.sha}`,
              ``,
              `This issue auto-closes on the next successful run.`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure',
              per_page: 100,
            });
            const match = existing.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Another failure — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sync-failure', 'backbone-freshness'],
              });
            }

      - name: Close stale failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = '${{ github.workflow }}';
            const title = `Scheduled workflow failing: ${workflow}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure',
              per_page: 100,
            });
            const match = existing.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Resolved — workflow succeeded on run ${context.runId}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'closed',
              });
            }
