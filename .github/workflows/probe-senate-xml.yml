name: Probe senate.gov XML reachability

# Temporary MR10 diagnostic: senate.gov roll-call XML is Akamai-blocked from
# Vercel's cloud IPs. This probe answers whether GitHub Actions runners are
# blocked too, which decides the Senate corpus mirror architecture.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe senate.gov and clerk.house.gov
        run: |
          set -x
          curl -s -o /dev/null -w "senate menu: %{http_code} (%{time_total}s)\n" --max-time 30 \
            "https://www.senate.gov/legislative/LIS/roll_call_lists/vote_menu_119_2.xml" || echo "senate menu: FAILED"
          curl -s -o /dev/null -w "senate vote: %{http_code} (%{time_total}s)\n" --max-time 30 \
            "https://www.senate.gov/legislative/LIS/roll_call_votes/vote1192/vote_119_2_00001.xml" || echo "senate vote: FAILED"
          curl -s -o /dev/null -w "clerk house: %{http_code} (%{time_total}s)\n" --max-time 30 \
            "https://clerk.house.gov/evs/2026/roll001.xml" || echo "clerk house: FAILED"
