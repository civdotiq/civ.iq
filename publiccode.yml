description:
  en:
    localisedName: CIV.IQ
    shortDescription: >-
      Nonpartisan civic data on Congress and state legislatures: votes,
      campaign finance, lobbying, and federal spending, from official records.
    longDescription: >-
      CIV.IQ is civic infrastructure that connects official government
      records into a unified, transparent interface for understanding how
      government works. It draws on 29 government data sources and 11 open
      datasets. Its public API has 39 documented endpoints in an
      OpenAPI specification, backed by Congress.gov, FEC, Census Bureau,
      USASpending.gov, LDA (lda.gov), Federal Register, BLS, and more, with
      state legislatures read through OpenStates and STOCK Act trades through
      the Congress Trading Monitor open dataset. The platform includes an
      intelligence layer of 17 statistical analyzers that detect patterns in
      voting behavior, campaign finance, lobbying-to-legislation pipelines,
      and stock trading by members of Congress. All analysis carries
      confidence scores, methodology documentation, and source citations.
      No mock data, no partisan framing, no editorializing.
    documentation: https://github.com/civdotiq/civ.iq/blob/main/docs/ARCHITECTURE.md
    apiDocumentation: https://github.com/civdotiq/civ.iq/blob/main/docs/API_REFERENCE.md
    features:
      - Congressional voting records with roll call detail
      - Campaign finance tracking via FEC filings
      - Lobbying disclosure analysis via LDA (lda.gov)
      - Federal spending by congressional district via USASpending
      - Intelligence layer with 17 statistical analyzers
      - Bill-lobbying language similarity detection
      - Stock trade-committee jurisdiction overlap analysis
      - State legislature data via OpenStates
      - District demographics via Census ACS
      - MCP server with 46 tools
      - Nostr signed event publishing
      - OpenAPI specification and TypeScript SDK
      - Embeddable widgets and Atom feeds

